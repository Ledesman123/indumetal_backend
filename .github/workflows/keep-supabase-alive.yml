name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Ping Supabase Database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          echo "Conectando a la base de datos..."
          # Extrae el host y puerto limpiando el prefijo jdbc:postgresql://
          CLEAN_URL=$(echo "$DB_URL" | sed 's#jdbc:postgresql://##' | cut -d'?' -f1)
          
          psql "postgresql://${DB_USER}:${PGPASSWORD}@${CLEAN_URL}" -c "SELECT 1;"