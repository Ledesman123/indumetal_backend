name: Keep Supabase Alive

on:
  schedule:
    # Ejecuta cada 5 días a las 12:00 UTC
    - cron: "0 12 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -L -s -o /dev/null -w "%{http_code}\n" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/"
