spring:
  application:
    name: almacen-backend

  # ---------------------------------------------------------
  # Conexion a Supabase (PostgreSQL)
  # Usa el "Connection string" modo Session Pooler (puerto 6543)
  # o Direct connection (puerto 5432) que Supabase te da en:
  # Project Settings > Database > Connection string
  # ---------------------------------------------------------
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.xxxxxxxxxxxx.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # IMPORTANTE: en produccion usar "validate".
      # Flyway es quien crea/versiona las tablas, Hibernate solo valida el mapeo.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:alertas@indumetal.pe}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# ---------------------------------------------------------
# Configuracion propia de la aplicacion (JWT, CORS, negocio)
# ---------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:cAmbiaEstaClaveSecretaPorUnaMuyLargaYAleatoriaEnProduccion123456}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}      # 1 hora
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000} # 24 horas
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  stock:
    revisar-cron: "0 0 7 * * *"   # todos los dias 7:00 a.m., revisa stock minimo

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.indumetal.almacen: DEBUG
    org.hibernate.SQL: WARN
