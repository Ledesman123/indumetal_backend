# Blueprint de Render: New > Blueprint > seleccionar este repo.
# Los valores marcados con sync: false se piden en el panel al crear el servicio.
services:
  - type: web
    name: indumetal-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
